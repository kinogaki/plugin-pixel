[package]
name = "kinogaki-pixel"
description = "Pixel, the realtime pixel-art render engine, as a render engine on the Kinogaki Studio SDK: its renderer (film, camera, BVH, dither, the passes on a wgpu host's own device), its description, material nodes, lights, fog, scene sync and render thread"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

# Pixel builds from its own repository and the public SDK's alone, checked
# out side by side as Studio's tree lays them out (README "Building"): its
# manifest names everything it needs instead of inheriting it from the tree.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
kinogaki-studio-api = { path = "../../sdk/crates/api", features = ["wgpu"] }
kinogaki-render-api = { path = "../../sdk/crates/render-api", features = ["wgpu"] }
# The records the GPU reads, laid out as the shaders read them (the
# version the SDK pins).
bytemuck = { version = "=1.25.2", features = ["derive"] }

[dev-dependencies]
# The SDK's engine test support: the device and its turns, counted wakes.
kinogaki-studio-api-testing = { path = "../../sdk/crates/api-testing", features = ["wgpu"] }
