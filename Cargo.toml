[package]
name = "kinogaki-pixel"
description = "Pixel, the realtime pixel-art render engine, as a render engine on the Kinogaki Studio SDK: its renderer (film, camera, BVH, dither, the passes on a wgpu host's own device), its description, material nodes, lights, fog, scene sync and render thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
kinogaki-studio-api = { workspace = true, features = ["wgpu"] }
kinogaki-render-api = { workspace = true, features = ["wgpu"] }
# The records the GPU reads, laid out as the shaders read them.
bytemuck.workspace = true

[dev-dependencies]
# The editor offscreen, and the conformance suite's engine consumer.
kinogaki-harness.workspace = true
kinogaki-studio-api-testing = { workspace = true, features = ["wgpu"] }
# What the example is modelled in.
kinogaki-mesh.workspace = true
kinogaki-mesh-kernel.workspace = true
# Reference images.
kinogaki-png.workspace = true
# The GPU tests' turns on the one GPU.
kinogaki-gpu-turns.workspace = true
